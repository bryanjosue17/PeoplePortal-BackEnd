apisix:
  node_listen: 9080
  enable_admin: true
  admin_api:
    listen: "0.0.0.0:9180"

deployment:
  role: traditional
  role_traditional:
    config_provider: yaml
  admin:
    admin_key: "edd1c9f034335f136f87ad84b625c8f1"

routes:
  - uri: /api/requests*
    name: requests-api
    methods: ["GET", "POST", "PATCH"]
    plugins:
      openid-connect:
        client_id: "peopleportal-api"
        client_secret: "CHANGE_ME"
        discovery: "http://keycloak:8080/realms/peopleportal/.well-known/openid-configuration"
        scope: "openid profile email"
        bearer_only: true
        realm: "peopleportal"
        session:
          secret: "CHANGE_ME_SESSION_SECRET"
    upstream:
      type: roundrobin
      nodes:
        "peopleportal-api:8080": 1

  - uri: /api/hr*
    name: hr-api
