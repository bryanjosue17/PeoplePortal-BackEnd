name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 9.0.x
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/peopleportal-api
  IMAGE_NAME_MIGRATIONS: ${{ github.repository_owner }}/peopleportal-api-migrations

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PeoplePortal.sln

      - name: Build
        run: dotnet build PeoplePortal.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PeoplePortal.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Codacy coverage reporter
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        run: |
          COVERAGE_FILE=$(find . -type f -name "coverage.cobertura.xml" | head -n 1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "No coverage.cobertura.xml file found"
            exit 1
          fi
          echo "Reporting coverage file: $COVERAGE_FILE"
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r "$COVERAGE_FILE"

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: '**/TestResults/**'

  docker:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags and labels
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_TAG=${{ github.ref_name }}
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tags_migrations=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MIGRATIONS }}:${BRANCH_TAG},${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MIGRATIONS }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: final
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: migrations
          tags: ${{ steps.meta.outputs.tags_migrations }}
          labels: ${{ steps.meta.outputs.labels }}


