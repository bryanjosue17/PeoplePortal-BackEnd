name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true

      - name: Restore
        run: dotnet restore PeoplePortal.sln

      - name: Build
        run: dotnet build PeoplePortal.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PeoplePortal.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Codacy coverage reporter
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        run: |
          COVERAGE_FILE=$(find . -type f -name "coverage.cobertura.xml" | head -n 1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "No coverage.cobertura.xml file found"
            exit 1
          fi
          echo "Reporting coverage file: $COVERAGE_FILE"
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r "$COVERAGE_FILE"

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: '**/TestResults/**'