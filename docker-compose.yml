services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: peopleportal-api:latest
    container_name: peopleportal-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Authority: http://localhost:8080/realms/peopleportal
      Authentication__Audience: peopleportal-api
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=PeoplePortalDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
    ports:
      - "8081:8080"
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: peopleportal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStrong@Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: peopleportal-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js"]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: peopleportal-api-migrations:latest
    profiles:
      - tools
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=PeoplePortalDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;

  etcd:
    image: bitnami/etcd:3.5
    container_name: peopleportal-etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
    ports:
      - "2379:2379"

  apisix:
    image: apache/apisix:3.9
    container_name: peopleportal-apisix
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    restart: unless-stopped

volumes:
  sqlserver-data:
