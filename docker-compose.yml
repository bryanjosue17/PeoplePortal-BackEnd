services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: peopleportal-api:latest
    container_name: peopleportal-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Authority: http://localhost:8080/realms/peopleportal
      Authentication__Audience: peopleportal-api
      ConnectionStrings__DefaultConnection: Host=postgres;Database=PeoplePortalDb;Username=postgres;Password=${POSTGRES_PASSWORD:-YourStrong@Passw0rd};
    ports:
      - "8081:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: peopleportal-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourStrong@Passw0rd}
      POSTGRES_DB: PeoplePortalDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: peopleportal-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js"]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: peopleportal-api-migrations:latest
    profiles:
      - tools
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=PeoplePortalDb;Username=postgres;Password=${POSTGRES_PASSWORD:-YourStrong@Passw0rd};

  etcd:
    image: bitnami/etcd:3.5
    container_name: peopleportal-etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
    ports:
      - "2379:2379"

  apisix:
    image: apache/apisix:3.9
    container_name: peopleportal-apisix
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    restart: unless-stopped

volumes:
  postgres-data:
