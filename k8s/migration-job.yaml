apiVersion: batch/v1
kind: Job
metadata:
  name: peopleportal-migrations
  namespace: peopleportal
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: peopleportal-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-sqlserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z sqlserver-service 1433; do echo waiting for sqlserver; sleep 3; done"
      containers:
        - name: migrate
          image: peopleportal-api-migrations:latest
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: peopleportal-secrets
                  key: ConnectionStrings__DefaultConnection
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
