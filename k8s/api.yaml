apiVersion: apps/v1
kind: Deployment
metadata:
  name: peopleportal-api
  namespace: peopleportal
  labels:
    app: peopleportal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peopleportal-api
  template:
    metadata:
      labels:
        app: peopleportal-api
    spec:
      initContainers:
        - name: wait-sqlserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z sqlserver-service 1433; do echo waiting for sqlserver; sleep 3; done"
        - name: wait-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z keycloak-service 8080; do echo waiting for keycloak; sleep 3; done"
      containers:
        - name: api
          image: peopleportal-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: peopleportal-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: peopleportal-secrets
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: peopleportal-api-service
  namespace: peopleportal
spec:
  selector:
    app: peopleportal-api
  ports:
    - port: 80
      targetPort: 8080
