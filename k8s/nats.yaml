apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: peopleportal
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      volumes:
        - name: jetstream-data
          emptyDir: {}
      containers:
        - name: nats
          image: nats:alpine
          imagePullPolicy: IfNotPresent
          args: ["-js", "-m", "8222", "-sd", "/data/jetstream"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          volumeMounts:
            - name: jetstream-data
              mountPath: /data/jetstream
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: nats-service
  namespace: peopleportal
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
